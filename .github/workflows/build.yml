name: Build TikTok Explorer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Buat Struktur & Compile APK
        run: |
          flutter create --org com.tiktok.explorer my_app
          # Mencari file pubspec dan main.dart di mana pun posisinya
          find . -name "pubspec.yaml" ! -path "./my_app/*" -exec cp {} my_app/pubspec.yaml \;
          find . -name "main.dart" ! -path "./my_app/*" -exec cp {} my_app/lib/main.dart \;
          cd my_app
          flutter pub get
          flutter build apk --release

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokExplorer-APK
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
