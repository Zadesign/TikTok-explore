name: Build TikTok Explorer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Buat Struktur & Compile APK
        run: |
          flutter create --org com.tiktok.explorer my_app
          
          # Salin file proyek
          find . -name "pubspec.yaml" ! -path "./my_app/*" -exec cp {} my_app/pubspec.yaml \;
          find . -name "main.dart" ! -path "./my_app/*" -exec cp {} my_app/lib/main.dart \;
          
          cd my_app
          
          # Sesuaikan versi SDK ke API 35 (Android 15) & minSdk 21
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
          sed -i 's/flutter.compileSdkVersion/35/g' android/app/build.gradle || true
          sed -i 's/flutter.targetSdkVersion/35/g' android/app/build.gradle || true
          
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle.kts || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle.kts || true
          
          # Terima semua lisensi SDK
          yes | flutter doctor --android-licenses || true
          
          flutter pub get
          flutter build apk --release

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokExplorer-APK
